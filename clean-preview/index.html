<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wcricket clean preview</title>
  <script>
    (async () => {
      const response = await fetch('../index.html', { cache: 'no-store' });
      let html = await response.text();
      html = html.replace('<head>', '<head><base href="../">');
      html = html.replace('<script src="js/main.js" defer><\/script>', '');
      html = html.replace('</head>', '<link rel="stylesheet" href="clean-preview/clean.css"><script src="clean-preview/main.js" defer><\/script></head>');
      document.open();
      document.write(html);
      document.close();
    })().catch(() => {
      document.body.innerHTML = '<p style="font:16px system-ui;padding:2rem">Unable to load the clean preview.</p>';
    });
  </script>
</head>
<body></body>
</html>
